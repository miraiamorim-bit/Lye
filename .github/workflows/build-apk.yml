name: Gerar APK

# Roda a cada push na main (e também manualmente, pela aba Actions).
# Este arquivo é autossuficiente: ele mesmo cria o capacitor.config.json, o package.json
# e o CSS das barras do Android durante o build. Só falta o seu site:
# coloque o index.html na raiz do repositório ou numa pasta chamada www.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Gerar APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # necessário para publicar o APK em Releases

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Instalar o Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Separar o site (pasta www ou raiz do repositório)
        run: |
          mkdir -p _apk/www
          if [ -f www/index.html ]; then
            cp -a www/. _apk/www/
          elif [ -f index.html ]; then
            find . -mindepth 1 -maxdepth 1 \
              ! -name .git ! -name .github ! -name _apk ! -name node_modules ! -name android \
              ! -name README.md ! -name .gitignore \
              -exec cp -a {} _apk/www/ \;
          else
            echo "::error::Não achei o index.html. Coloque o seu site na raiz do repositório ou na pasta www."
            exit 1
          fi

      - name: Definir nome e ID do app a partir do nome do repositório
        run: |
          NOME="${GITHUB_REPOSITORY#*/}"
          SLUG="$(echo "${GITHUB_REPOSITORY_OWNER}_${NOME}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/_/g')"
          echo "APP_NOME=$NOME" >> "$GITHUB_ENV"
          echo "APP_ID=com.github.r_$SLUG" >> "$GITHUB_ENV"

      - name: Criar o projeto Capacitor
        working-directory: _apk
        run: |
          cat > package.json <<'EOF'
          {
            "name": "site-para-apk",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^8.0.0",
              "@capacitor/core": "^8.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^8.0.0"
            }
          }
          EOF
          node - <<'EOF'
          const fs = require("fs");
          const config = {
            appId: process.env.APP_ID,
            appName: process.env.APP_NOME,
            webDir: "www",
            plugins: {
              SystemBars: { insetsHandling: "css", initialViewportFitValueHint: "cover" }
            }
          };
          fs.writeFileSync("capacitor.config.json", JSON.stringify(config, null, 2) + "\n");
          EOF

      - name: Ajustar o site para as barras do Android
        working-directory: _apk
        run: |
          cat > www/apk-safe-area.css <<'EOF'
          /* Adicionado automaticamente no APK: evita que o conteúdo fique atrás das barras do sistema do Android. */
          html {
            box-sizing: border-box;
            padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
            padding-right: var(--safe-area-inset-right, env(safe-area-inset-right, 0px));
            padding-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
            padding-left: var(--safe-area-inset-left, env(safe-area-inset-left, 0px));
          }
          EOF
          node - <<'EOF'
          const fs = require("fs");
          const path = require("path");
          const listar = (d) => fs.readdirSync(d, { withFileTypes: true })
            .flatMap((e) => (e.isDirectory() ? listar(path.join(d, e.name)) : [path.join(d, e.name)]));
          const META = '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">';
          const LINK = '<link rel="stylesheet" href="/apk-safe-area.css">';
          for (const arq of listar("www").filter((f) => /\.html?$/i.test(f))) {
            const original = fs.readFileSync(arq, "utf8");
            let h = original;
            const abreHead = /<head(\s[^>]*)?>/i;
            if (!abreHead.test(h)) continue;
            if (!/viewport-fit\s*=\s*cover/i.test(h)) {
              const tag = /<meta\b[^>]*\bname\s*=\s*["']viewport["'][^>]*>/i.exec(h);
              if (tag) {
                const nova = tag[0].replace(/(\bcontent\s*=\s*)(["'])(.*?)\2/i, "$1$2$3, viewport-fit=cover$2");
                h = h.replace(tag[0], () => nova);
              } else {
                h = h.replace(abreHead, (m) => m + META);
              }
            }
            h = h.replace(abreHead, (m) => m + LINK);
            if (h !== original) fs.writeFileSync(arq, h);
          }
          EOF

