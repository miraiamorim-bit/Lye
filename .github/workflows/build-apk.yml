name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Gerar APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Instalar o Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Definir nome e ID do app a partir do nome do repositório
        run: |
          NOME="${GITHUB_REPOSITORY#*/}"
          SLUG="$(echo "${GITHUB_REPOSITORY_OWNER}_${NOME}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/_/g')"
          echo "APP_NOME=$NOME" >> "$GITHUB_ENV"
          node -e '
            const fs = require("fs");
            const c = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            c.appName = process.argv[1];
            c.appId = "com.github.r_" + process.argv[2];
            fs.writeFileSync("capacitor.config.json", JSON.stringify(c, null, 2) + "\n");
          ' "$NOME" "$SLUG"

      - name: Instalar o Capacitor
        run: npm install --no-audit --no-fund

      - name: Ajustar o site para as barras do Android
        run: |
          cp apk-safe-area.css www/apk-safe-area.css
          find www -type f -name '*.html' -exec sed -i -E 's#<head(\s[^>]*)?>#<head\1><link rel="stylesheet" href="/apk-safe-area.css">#I' {} +

      - name: Usar sempre a mesma chave de assinatura de teste
        run: |
          mkdir -p ~/.android
          base64 -d debug.keystore.base64 > ~/.android/debug.keystore

      - name: Criar o projeto Android
        run: npx cap add android

      - name: Copiar o site para o app
        run: npx cap sync android

      - name: Compilar o APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renomear o APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "${APP_NOME}.apk"

      - name: Guardar o APK como artefato (cópia de segurança)
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: ${{ env.APP_NOME }}.apk

      - name: Publicar o APK em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-mais-recente --cleanup-tag --yes || true
          gh release create apk-mais-recente "${APP_NOME}.apk" \
            --title "APK mais recente" \
            --notes "APK gerado automaticamente a partir do commit ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA"
