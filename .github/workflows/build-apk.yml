      - name: Instalar o Capacitor
        working-directory: _apk
        run: npm install --no-audit --no-fund

      - name: Criar o projeto Android
        working-directory: _apk
        run: npx cap add android

      - name: Copiar o site para o app
        working-directory: _apk
        run: npx cap sync android

      - name: Compilar o APK
        working-directory: _apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renomear o APK
        run: cp _apk/android/app/build/outputs/apk/debug/app-debug.apk "${APP_NOME}.apk"

      - name: Guardar o APK como artefato (cópia de segurança)
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: ${{ env.APP_NOME }}.apk

      - name: Publicar o APK em Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete apk-mais-recente --cleanup-tag --yes || true
          gh release create apk-mais-recente "${APP_NOME}.apk" \
            --title "APK mais recente" \
            --notes "APK gerado automaticamente a partir do commit ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA"

      - name: Mostrar onde está o APK
        run: |
          echo "APK pronto. Baixe em: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/apk-mais-recente" >> "$GITHUB_STEP_SUMMARY"
