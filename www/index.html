<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contador</title>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;font-family:system-ui,sans-serif;background:#f6f8fa;color:#1f2328}
#n{font-size:5rem;font-weight:700}
button{padding:16px 32px;font-size:1.2rem;border:0;border-radius:12px;background:#0969da;color:#fff;font-weight:600}
</style>
</head>
<body>
<h1>Contador</h1>
<div id="n">0</div>
<button onclick="n.textContent=Number(n.textContent)+1">Somar 1</button>
<button onclick="n.textContent=0" style="background:#656d76">Zerar</button>
</body>
</html>
